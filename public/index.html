<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Web Development Practice: Daily Exercise Sheets</title>
        <meta charset="utf-8">
        <meta name="viewport", content="width=device-width, initial-scale=1">
        <link rel="stylesheet", href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body>
        <h2 style="text-align:center;">Daily Exercise Sheet</h2>

        <div class="form-container">
            <form id="exercise-form">
                <input type="text" id="exerciseName" placeholder="Exercise Name" required />
                <input type="number" id="numReps" placeholder="Number of Reps" required />
                <input type="number" id="totalWeight" placeholder="Total Weight (Lbs.)" required />
                <input type="number" id="numSets" placeholder="How Many Sets" required />
                <br>
                <button type="button" id="addExercise">Add Exercise</button>
            </form>
        </div>

        <table id="exerciseTable">
            <thead>
                <tr>
                    <th>Exercise Name</th>
                    <th>Number of Reps</th>
                    <th>Weight Amount</th>
                    <th>How Many Sets</th>
                    <th>Total Weight Lifted</th>
                    <th>User Actions</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>

        <!-- "GET" and "POST" Example -->
        <h1>"GET" and "POST" Example</h1>
        <input id="nameExample" type="text" placeholder="Enter name">
        <button id="buttonExample">Example</button>
        <p id="resultExample"></p>
    </body>

</html>
